        "@type": "WebSite",
        "name": "jobs.vision",
        "url": "https://www.jobs.vision/",
        "description": "Optometry and eye care jobs for optometrists, opticians, technicians, and practice teams.",

        },
        "potentialAction": {

          "target": "https://www.jobs.vision/jobs?search={search_term_string}",
